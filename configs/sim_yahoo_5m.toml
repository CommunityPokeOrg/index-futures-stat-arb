# REAL Yahoo data: continuous front-month prices; retention limits apply.
[simulation]
start = "2026-07-20"
end = "2026-09-14"
initial_capital_usd = 1000000.0
bar_minutes = 5
rth_only = true
signal_lag_bars = 1
z_window = 78
entry = 2.0
exit = 0.5
stop = 4.0
hedge_lookback_sessions = 10
min_hedge_sessions = 5
mask_roll_sessions = false
adjust = "none"
z_reset_each_session = true

[costs]
commission_per_contract_usd = 1.25
exchange_fees_per_contract_usd = 1.38
slippage_ticks = 1.0
half_spread_ticks = 0.5

[sizer]
name = "dollar_neutral"
es_contracts = 2
max_contracts = 20

[yahoo]
interval = "5m"
bar_minutes = 5
rth_only = true
