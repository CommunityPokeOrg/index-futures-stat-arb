[simulation]
products = ["ES", "SPY"]
start = "2015-01-01"
end = "2026-09-14"
initial_capital_usd = 1000000.0
bar_minutes = 1
rth_only = false
signal_lag_bars = 1
z_window = 60
entry = 2.0
exit = 0.5
stop = 4.0
hedge_lookback_sessions = 120
min_hedge_sessions = 60
mask_roll_sessions = false
adjust = "none"
z_reset_each_session = false
carry_adjust = true
hedge_method = "unit"
kalman_delta = 1e-5
kalman_obs_var = 1e-6
coint_pvalue_gate = 0.10
threshold_mode = "ou"
half_life_min_bars = 1.0
half_life_max_bars = 30.0
max_holding_half_lives = 2.0
ou_min_obs = 30

[costs]
equity_commission_per_share_usd = 0.005
equity_slippage_ticks = 1.0
equity_half_spread_ticks = 0.5

[sizer]
name = "vol_target"
target_daily_vol_usd = 5000.0
lookback_sessions = 20
max_units_a = 50
max_leg_notional_usd = 2000000.0

[yahoo]
rate_symbol = "IRX"
carry_adjust = true
fallback_risk_free_rate = 0.04
fallback_dividend_yield = 0.012
interval = "1d"

[walkforward]
n_trials = 48
n_folds = 5
min_train_sessions = 500
min_trades_per_fold = 3
seed = 0

[walkforward.space]
