[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "index_futures_stat_arb"
version = "0.1.0"
description = "Research scaffold for ES vs NQ index-futures statistical arbitrage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "pyarrow>=14",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
databento = ["databento>=0.40"]
notebook = ["jupyter>=1.0", "ipykernel>=6.25"]
dev = ["pytest>=7.4", "ruff>=0.1", "mypy>=1.8", "pandas-stubs", "yfinance>=0.2.40"]

[project.scripts]
ifsa = "index_futures_stat_arb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live Yahoo endpoints"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src"]
